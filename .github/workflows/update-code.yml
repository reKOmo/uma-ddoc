# Syncs the tier list calculation, scenario presets and upstream's test for
# them with upstream main. A verified update is opened as a pull request; an
# update that fails verification fails this job (GitHub emails you) and
# update-status.json is attached to the run.
name: Update tier list code

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Verification fetches fresh card data itself (test/global-setup.js).
      - name: Update code from upstream
        run: pnpm update-code
      - name: Upload update status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-status
          path: update-status.json
          if-no-files-found: ignore
      - name: Describe update
        id: describe
        run: |
          echo "message=$(node -p 'require("./update-status.json").message')" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            node -p 'require("./update-status.json").files.join("\n")'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Opens a PR only when one of the managed files actually changed.
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream-code-update
          add-paths: ${{ steps.describe.outputs.files }}
          commit-message: "Update tier list code from upstream"
          title: "Update tier list code from upstream"
          body: |
            ${{ steps.describe.outputs.message }}

            Verified by `pnpm update-code`: tests and build passed against the latest card data.
