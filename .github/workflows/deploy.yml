# Builds the site with fresh card data from upstream and deploys it to GitHub
# Pages. Runs daily so new cards show up without a commit. If the card data
# breaks a test, the job fails (GitHub emails you) and the last good deploy
# stays live.
name: Deploy site

# Manual runs only for now; uncomment push/schedule to run automatically again.
on:
  # push:
  #   branches: [main]
  # schedule:
  #   - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format check
        run: pnpm lint
      - name: Generate card data
        run: pnpm update-cards
      - name: Scrape JP banners and card links from GameTora
        run: pnpm scrape-gametora
      # Normally already done and committed by news.yml; rerun so a news commit made any other way
      # still shows up (not committed from here).
      - name: Apply the official news to Global's banners
        run: pnpm update-global
      - name: Map banner cards to card data
        run: pnpm map-banner-cards
      - uses: astral-sh/setup-uv@v10.2.0 # no floating v10 tag (setup-uv stopped publishing major tags after v7)
        with:
          enable-cache: true
          cache-dependency-glob: ml/requirements.txt
      - name: Predict Global release dates of JP cards
        run: pnpm setup-ml && pnpm predict-gl
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
