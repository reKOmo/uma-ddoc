# Builds the site with fresh card data from upstream and deploys it to GitHub
# Pages. Runs daily so new cards show up without a commit. If the card data
# breaks a test, the job fails (GitHub emails you) and the last good deploy
# stays live. On a pull request it only builds and tests: `build` is the check
# main's ruleset requires before a PR can merge.
name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push to the same PR replaces its running check; deploys queue instead.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format check
        run: pnpm lint
      - name: Generate card data
        run: pnpm update-cards
      # After update-cards: the code imports generated/ (card data, sources.json), which a fresh checkout lacks.
      - name: Type check
        run: pnpm typecheck
      - name: Scrape new cards, scenarios and JP's event history from GameTora
        run: pnpm scrape-gametora
      # Normally already done and committed by the news run (scripts/news-run.sh); rerun so a news commit made any
      # other way still shows up (not committed from here). JP's first: Global's news pairs with JP's banners by id.
      - name: Apply the official JP news to JP's banners and events
        run: pnpm update-jp
      - name: Apply the official news to Global's banners
        run: pnpm update-global
      - uses: astral-sh/setup-uv@v10.2.0 # no floating v10 tag (setup-uv stopped publishing major tags after v7)
        with:
          enable-cache: true
          cache-dependency-glob: ml/requirements.txt
      - name: Predict Global release dates of JP cards
        run: pnpm setup-ml && pnpm predict-gl
      # After the predictions: the advice is matched to Global's banners, predicted ones included.
      - name: Fetch pull advice from Luh's Support Card Encyclopedia
        run: pnpm fetch-pull-guide
      - name: Test
        run: pnpm test
      - name: End-to-end tests (the app in a browser)
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
      - name: Build
        run: pnpm build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
