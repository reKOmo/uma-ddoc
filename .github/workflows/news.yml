# Fetches new announcements (banners, events, updates) from the official Global site
# (umamusume.com/news) once a day into data/news/, adds announced banners to Global's own record (data/,
# scripts/update-global.js) and commits both with a summary of what was added. Posts usually go up at 22:00 UTC. Incremental: each run only asks for
# posts newer than the last one (see scripts/fetch-news.js). A push made with GITHUB_TOKEN
# doesn't trigger the deploy workflow, so when a banner was announced this starts a deploy
# itself, so announced banners reach the calendar.
name: Fetch news

# Manual runs only for now; uncomment schedule (and the redeploy step below) to run automatically again.
on:
  # schedule:
  #   - cron: "43 23 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: Fetch the whole news archive (index pages only)
        type: boolean
        default: false

permissions:
  contents: write
  # actions: write # start the deploy workflow (redeploy step, commented out)

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fetch news
        id: news
        run: node scripts/fetch-news.js ${{ inputs.backfill && '--backfill' || '' }}
      # Global's banners are JP's under the same ids: needs JP's banners (GameTora) + card names.
      - name: Add announced banners to Global's record
        if: steps.news.outputs.banners == 'true'
        run: node scripts/update-cards.js && node scripts/scrape-gametora.js && node scripts/update-global.js
      - name: Commit new announcements
        if: steps.news.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "News: $(sed -n 3p data/news/summary.md)" -m "$(tail -n +5 data/news/summary.md)"
          git push
      # - name: Redeploy with the announced banners
      #   if: steps.news.outputs.banners == 'true'
      #   run: gh workflow run deploy.yml --ref ${{ github.ref_name }}
      #   env:
      #     GH_TOKEN: ${{ github.token }}
